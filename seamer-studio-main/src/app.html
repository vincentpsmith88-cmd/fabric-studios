<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="theme-color" content="#f05139" />
    <link rel="icon" type="image/png" href="%sveltekit.assets%/images/fabric-now-logo.png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/images/fabric-now-logo.png" />
    <link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no" />
    <script>
      // Apply the saved theme before CSS paints; first visits start in light mode.
      try {
        const saved = localStorage.getItem('theme');
        const theme = saved === 'dark' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
      } catch { /* storage/privacy mode: DaisyUI's light default remains available */ }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Exa:wght@200;600&family=Noto+Sans+Display:ital,wght@0,100..900;1,100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
    <title>Fabric Now Studios</title>
    <script src="%sveltekit.assets%/external-js/long-press-event.min.js" defer></script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
